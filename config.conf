# Server 1 - Default Server
[server]
host=127.0.0.1
port=8080
server_name=localhost
root=www
body_limit=1048576

[errors]
400=errors/400.html
403=errors/403.html
404=errors/404.html
405=errors/405.html
413=errors/413.html
500=errors/500.html
502=errors/502.html
504=errors/504.html

[route /]
methods=GET,POST,DELETE
root=www
index=index.html

[route /upload]
methods=GET,POST,DELETE
root=www/uploads
upload_dir=www/uploads

[route /listing]
methods=GET
root=www/uploads
listing=true

[route /redirect]
methods=GET
redirect=/index.html

[route /restricted]
methods=GET
root=www

# Server 2 - Secondary Virtual Host / Port
[server]
host=127.0.0.1
port=8081
server_name=second.com
root=www
body_limit=524288

[route /]
methods=GET
root=www
index=index.html
